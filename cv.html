---
layout: default
title: CV
permalink: /cv/
---

<!-- ==================== PAGE HERO ==================== -->
<section class="section section--navy page-hero">
  <div class="parallax-container">
    <div class="geo geo--square parallax-layer" data-speed="-0.07" style="width:50px;height:50px;top:25%;right:12%;"></div>
    <div class="geo geo--ring parallax-layer" data-speed="0.05" style="width:100px;height:100px;top:50%;left:5%;"></div>
  </div>

  <div class="container">
    <div class="page-hero-inner">
      <div class="page-hero-text reveal-left">
        <p class="label">Background</p>
        <h1 class="section-title">Curriculum Vitae</h1>
        <p class="lead">A summary of my education, skills, and experience.</p>
      </div>

      <div class="page-hero-character character character--breathe reveal-right">
        <div class="speech-bubble speech-bubble--top" data-text="Here's my CV!" data-delay="1000">&nbsp;</div>
        {% include characters/work.html %}
      </div>
    </div>
  </div>
</section>

<!-- ==================== CV CONTENT ==================== -->
<section class="section section--dark">
  <div class="container container--narrow">
    <div class="card-panel reveal-scale" style="text-align:center;">
      <h2>Download</h2>
      <p style="margin: 1rem auto; color: var(--text-secondary);">
        View or download my full CV as a PDF.
      </p>
      <a class="btn btn--on-card" href="{{ '/assets/cv/CV.pdf' | relative_url }}" target="_blank" rel="noopener">
        Download CV (PDF)
      </a>
      <p style="margin-top:1.5rem; font-size:0.85rem; color: var(--muted);">
        Replace <code>assets/cv/CV.pdf</code> with your actual CV file.
      </p>
    </div>
  </div>
</section>
